version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  admission:
    build: ./admission
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

    treatment:
    build: ./treatment
    ports:
      - "8006:8006"
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq


  doctor-assignment:
    build: ./doctor-assignment
    ports:
      - "8003:8003"
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      -

  monitor:
    build: ./monitor
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

  discharge:  
    build: ./discharge
    ports:
      - "8009:8000"
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq

networks:
  default:
    driver: bridge
