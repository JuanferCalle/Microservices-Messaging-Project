# monitor (listens to all topics)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor
  template:
    metadata:
      labels:
        app: monitor
    spec:
      containers:
        - name: monitor
          image: hospital-monitor:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: SERVICE_NAME
              value: monitor
            - name: CONSUME_KEY
              value: "#"
          ports:
            - containerPort: 8000
